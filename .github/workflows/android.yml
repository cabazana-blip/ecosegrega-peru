name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore project source
        run: |
          base64 -d project.b64 > project.tar.gz
          tar -xzf project.tar.gz
          rm project.tar.gz

      - name: Apply AGP 9 compatibility patch
        run: |
          sed -i '/org.jetbrains.kotlin.android/d' build.gradle.kts
          sed -i '/org.jetbrains.kotlin.android/d' app/build.gradle.kts
          sed -i 's/compileSdk = 36/compileSdk = 37/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EcoSegrega-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
